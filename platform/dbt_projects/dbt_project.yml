name: 'claims'
version: '1.0.0'
config-version: 2

profile: 'default_project'


model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  "*":
    +materialized: table

  staging:
    +materialized: view
    +schema: staging

  marts:
    +materialized: table
    +schema: marts
