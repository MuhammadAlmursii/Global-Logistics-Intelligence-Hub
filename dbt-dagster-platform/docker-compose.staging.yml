version: '3.8'

services:
  # PostgreSQL database for Dagster storage (Staging)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: dagster_staging
      POSTGRES_USER: dagster_staging
      POSTGRES_PASSWORD: dagster_staging_password
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster_staging"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dagster webserver (Staging)
  dagster-webserver:
    build: .
    environment:
      - ENVIRONMENT=staging
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=dagster_staging
      - POSTGRES_USER=dagster_staging
      - POSTGRES_PASSWORD=dagster_staging_password
    env_file:
      - .env.staging
    volumes:
      - ./workspace:/opt/dagster/workspace
      - ./profiles:/opt/dagster/dbt_profiles
      - ./dbt_projects:/opt/dagster/dbt_projects
      - ./config:/opt/dagster/config
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w workspace/workspace.yaml

  # Dagster daemon (Staging)
  dagster-daemon:
    build: .
    environment:
      - ENVIRONMENT=staging
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=dagster_staging
      - POSTGRES_USER=dagster_staging
      - POSTGRES_PASSWORD=dagster_staging_password
    env_file:
      - .env.staging
    volumes:
      - ./workspace:/opt/dagster/workspace
      - ./profiles:/opt/dagster/dbt_profiles
      - ./dbt_projects:/opt/dagster/dbt_projects
      - ./config:/opt/dagster/config
    depends_on:
      postgres:
        condition: service_healthy
    command: dagster-daemon run

volumes:
  postgres_staging_data:

