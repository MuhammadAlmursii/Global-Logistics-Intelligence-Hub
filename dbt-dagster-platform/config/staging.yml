# Staging Environment Configuration
environment: staging

# Snowflake Configuration (Staging)
snowflake:
  account: "your_staging_account"
  warehouse: "STAGING_WH"
  database: "STAGING_DB"
  schema: "PUBLIC"
  role: "STAGING_ROLE"

# Dagster Configuration
dagster:
  webserver_port: 3000
  telemetry_enabled: false

# Storage Configuration
storage:
  backend: "postgres"
  postgres_host: "postgres-staging"
  postgres_port: 5432
  postgres_db: "dagster_staging"
  postgres_user: "dagster"
  postgres_password: "dagster_staging_password"

# dbt Configuration
dbt:
  profiles_dir: "/opt/dagster/profiles"
  project_dir: "/opt/dagster/dbt_projects"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
